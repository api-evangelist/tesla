name: Tesla
description: Tesla, Inc. is an American electric vehicle and clean energy company
  founded in 2003. Tesla offers the Fleet API for partners to access Tesla vehicles
  and energy devices with owner-granted permissions, covering vehicle telemetry, remote
  commands, charging management, energy site management, and fleet management capabilities.
